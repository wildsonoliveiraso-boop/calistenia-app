name: 📱 Build Android APK (Bubblewrap/TWA)

on:
  workflow_dispatch:
    inputs:
      pages_url:
        description: 'URL do GitHub Pages (ex: https://usuario.github.io/repo)'
        required: false
        default: ''
        type: string

  workflow_run:
    workflows: ['🚀 Deploy → GitHub Pages']
    types: [completed]

permissions:
  contents: read

jobs:
  build-apk:
    name: 🤖 Build APK via Bubblewrap TWA
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Android SDK ───────────────────────────────────────────
      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 4. Node.js ───────────────────────────────────────────────
      - name: 🟩 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 5. Ícones ────────────────────────────────────────────────
      - name: 🎨 Generate app icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick 2>/dev/null
          node generate-icons.js
          echo "Ícones gerados:"
          ls -la icons/

      # ── 6. Determinar URL do GitHub Pages ────────────────────────
      - name: 🌐 Determine Pages URL
        id: url
        run: |
          MANUAL="${{ github.event.inputs.pages_url }}"
          if [ -n "$MANUAL" ]; then
            PAGES_URL="$MANUAL"
          else
            OWNER="${{ github.repository_owner }}"
            REPO="${{ github.event.repository.name }}"
            PAGES_URL="https://${OWNER}.github.io/${REPO}"
          fi
          PAGES_URL="${PAGES_URL%/}"
          echo "url=$PAGES_URL" >> $GITHUB_OUTPUT
          echo "host=$(echo $PAGES_URL | sed 's|https://||' | cut -d'/' -f1)" >> $GITHUB_OUTPUT
          echo "📡 Pages URL: $PAGES_URL"

      # ── 7. Aguardar Pages estar acessível ────────────────────────
      - name: ⏳ Wait for Pages to be accessible
        run: |
          PAGES_URL="${{ steps.url.outputs.url }}"
          MANIFEST_URL="${PAGES_URL}/manifest.json"
          echo "🔍 Verificando disponibilidade: $MANIFEST_URL"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$MANIFEST_URL" 2>/dev/null || echo "000")
            echo "  Tentativa $i/12 → HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ App acessível!"
              break
            fi
            sleep 5
          done

      # ── 8. Gerar Keystore de debug ───────────────────────────────
      - name: 🔑 Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Calistenia Debug, OU=Dev, O=Calistenia, L=BR, S=BR, C=BR" \
            2>/dev/null
          echo "✅ Keystore de debug gerado"

      # ── 9. Pré-configurar caminhos do Bubblewrap ──────────────────
      # CRÍTICO: Configura ~/.bubblewrap/config.json ANTES de chamar qualquer comando do Bubblewrap
      # Isso impede que o Bubblewrap trave no prompt interativo "Do you want Bubblewrap to install the JDK?"
      - name: ⚙️ Pre-configure Bubblewrap paths
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          }
          EOF
          echo "✅ ~/.bubblewrap/config.json configurado:"
          cat ~/.bubblewrap/config.json

      # ── 10. Instalar Bubblewrap CLI ──────────────────────────────
      - name: 📦 Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli@latest
          bubblewrap --version

      # ── 11. Sincronizar twa-manifest.json ────────────────────────
      - name: 📋 Prepare twa-manifest.json
        run: |
          PAGES_URL="${{ steps.url.outputs.url }}"
          HOST="${{ steps.url.outputs.host }}"
          START_PATH=$(echo $PAGES_URL | sed "s|https://$HOST||")
          [ -z "$START_PATH" ] && START_PATH="/"
          [[ "$START_PATH" != */ ]] && START_PATH="${START_PATH}/"

          cat > twa-manifest.json << EOF
          {
            "packageId": "com.treino.calistenia",
            "host": "$HOST",
            "name": "Treino de Calistenia",
            "launcherName": "Calistenia",
            "display": "standalone",
            "themeColor": "#10b981",
            "navigationColor": "#0f172a",
            "navigationColorDark": "#0f172a",
            "navigationDividerColor": "#1e293b",
            "navigationDividerColorDark": "#1e293b",
            "backgroundColor": "#0f172a",
            "enableNotifications": false,
            "startUrl": "$START_PATH",
            "iconUrl": "${PAGES_URL}/icons/icon-512.png",
            "maskableIconUrl": "${PAGES_URL}/icons/icon-512.png",
            "monochromeIconUrl": "${PAGES_URL}/icons/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "./debug.keystore",
              "alias": "androiddebugkey"
            },
            "enableSiteSettingsShortcut": true,
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "${PAGES_URL}/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "${PAGES_URL}/",
            "minSdkVersion": 21,
            "orientation": "portrait",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "appVersionName": "1.0.0"
          }
          EOF
          echo "✅ twa-manifest.json pronto:"
          cat twa-manifest.json

      # ── 12. Gerar projeto Android via Bubblewrap ─────────────────
      - name: 🔧 Generate Android Project
        run: |
          PAGES_URL="${{ steps.url.outputs.url }}"
          echo "Gerando/atualizando projeto Android..."

          # Aceita licenças do Android SDK se necessário
          yes | sdkmanager --licenses 2>/dev/null || true

          # Atualiza ou gera o projeto sem prompts
          bubblewrap update --skipVersionUpgrade || {
            echo "Update direto falhou, inicializando a partir do manifesto web..."
            yes "" | bubblewrap init --manifest "${PAGES_URL}/manifest.json" --directory . || true
          }

          echo "Arquivos no diretório após geração:"
          ls -la

      # ── 13. Build APK ────────────────────────────────────────────
      - name: 🏗️ Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android
          BUBBLEWRAP_KEY_PASSWORD: android
        run: |
          echo "🏗️ Iniciando build do APK..."

          # Tenta build via Bubblewrap
          bubblewrap build --skipPwaValidation || BUILD_FAILED=true

          # Se o build do Bubblewrap falhou, compila diretamente com Gradle
          if [ -n "$BUILD_FAILED" ]; then
            echo "⚠️ Tentando compilar via Gradle diretamente..."
            GRADLEW_DIR=$(find . -name "gradlew" -type f -exec dirname {} \; | head -n 1)
            if [ -n "$GRADLEW_DIR" ]; then
              cd "$GRADLEW_DIR"
              chmod +x gradlew
              ./gradlew assembleDebug --no-daemon
              cd - > /dev/null
            else
              echo "❌ gradlew não encontrado"
              exit 1
            fi
          fi

          echo ""
          echo "📱 APKs gerados:"
          find . -name "*.apk" -type f

      # ── 14. Preparar arquivos para download ──────────────────────
      - name: 📝 Collect APKs
        if: always()
        run: |
          mkdir -p output
          find . -name "*.apk" -type f ! -path "./output/*" | while read f; do
            BASE=$(basename "$f" .apk)
            cp "$f" "output/calistenia-${BASE}.apk"
            echo "Copiado: $f → output/calistenia-${BASE}.apk"
          done
          echo "Conteúdo de output/:"
          ls -lh output/

      # ── 15. Upload do APK como artefato ──────────────────────────
      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calistenia-apk-${{ github.run_number }}
          path: |
            output/*.apk
            *.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      # ── 16. Resumo do build ───────────────────────────────────────
      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## 📱 Resultado do Build do APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL do App:** ${{ steps.url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          APK_COUNT=$(find output/ -name "*.apk" -type f 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -gt "0" ]; then
            echo "✅ **$APK_COUNT APK(s) gerado(s) com sucesso!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Baixe o arquivo na seção **Artifacts** abaixo:" >> $GITHUB_STEP_SUMMARY
            ls -lh output/*.apk >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Nenhum APK foi gerado.** Verifique os logs das etapas anteriores." >> $GITHUB_STEP_SUMMARY
          fi
